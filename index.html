<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#183b2a">
<title>Home Maintenance Planner V2</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <div><small>HOME & PROPERTY</small><h1>Maintenance Planner V2</h1>
  <p>Maintenance, vehicles, power equipment, and home equipment in one place.</p></div>
  <button id="addBtn">+ Add Item</button>
</header>
<main>
<nav id="tabs">
<button data-view="maintenance" class="active">Maintenance</button>
<button data-view="vehicles">Vehicles</button>
<button data-view="power">Power Equipment</button>
<button data-view="home">Home Equipment</button>
</nav>

<section id="maintenance" class="view">
<div class="stats">
<div><span>Overdue</span><strong id="overdue">0</strong></div>
<div><span>Due Soon</span><strong id="soon">0</strong></div>
<div><span>Upcoming</span><strong id="upcoming">0</strong></div>
</div>
<div class="toolbar"><input id="search" placeholder="Search maintenance...">
<select id="assetFilter"><option value="">All equipment</option></select></div>
<div id="taskList"></div>
</section>

<section id="vehicles" class="view hidden"><h2>Vehicles</h2><div id="vehiclesList" class="grid"></div></section>
<section id="power" class="view hidden"><h2>Power Equipment</h2><div id="powerList" class="grid"></div></section>
<section id="home" class="view hidden"><h2>Home Equipment</h2><div id="homeList" class="grid"></div></section>
</main>

<dialog id="assetDialog"><form id="assetForm">
<h2>Edit Equipment</h2><input type="hidden" id="assetId">
<label>Name<input id="name" required></label>
<div class="two"><label>Year<input id="year"></label><label>Type<select id="type">
<option value="vehicle">Vehicle</option><option value="power">Power Equipment</option><option value="home">Home Equipment</option></select></label></div>
<div class="two"><label>Make / Brand<input id="make"></label><label>Model<input id="model"></label></div>
<label>VIN / Serial<input id="serial"></label>
<div class="two"><label>Current meter<input id="meter" type="number" step=".1"></label><label>Meter type<select id="meterType"><option>miles</option><option>hours</option><option>none</option></select></label></div>
<label>Notes<textarea id="notes"></textarea></label>
<div class="actions"><button type="button" id="cancelAsset">Cancel</button><button type="submit">Save</button></div>
</form></dialog>

<dialog id="taskDialog"><form id="taskForm">
<h2>Maintenance Task</h2><input type="hidden" id="taskId">
<label>Task<input id="taskName" required></label>
<label>Equipment<select id="taskAsset"></select></label>
<div class="two"><label>Next due date<input id="dueDate" type="date"></label><label>Repeat months<input id="months" type="number" min="0"></label></div>
<div class="two"><label>Every miles<input id="miles" type="number" min="0"></label><label>Every hours<input id="hours" type="number" min="0"></label></div>
<label>Factory / service notes<textarea id="taskNotes"></textarea></label>
<div class="actions"><button type="button" id="cancelTask">Cancel</button><button type="submit">Save</button></div>
</form></dialog>
<script src="app.js"></script>
</body></html>
